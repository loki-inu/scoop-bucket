name: test
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  scoop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Scoop
        shell: pwsh
        run: |
          iex "& {$(irm get.scoop.sh)} -RunAsAdmin"
          "$env:USERPROFILE\scoop\shims" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install relnote from this bucket
        shell: pwsh
        run: scoop install .\bucket\relnote.json
      - name: Smoke
        shell: pwsh
        run: |
          relnote --version
          $out = relnote --version
          if ($out -notmatch 'relnote') { throw "unexpected: $out" }
      - name: Notes from a real repo
        shell: pwsh
        run: |
          $d = Join-Path $env:RUNNER_TEMP demo
          New-Item -ItemType Directory $d | Out-Null
          Set-Location $d
          git init -q -b main
          git config user.email ci@example.com
          git config user.name ci
          git commit -q --allow-empty -m "feat: first"
          git tag v0.1.0
          git commit -q --allow-empty -m "feat: add export"
          git commit -q --allow-empty -m "fix: handle empty input"
          $notes = relnote | Out-String
          Write-Output $notes
          if ($notes -notmatch 'add export') { throw "missing feature line" }
          if ($notes -notmatch 'handle empty input') { throw "missing fix line" }
          relnote --next-version
